<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="t d">
  <title id="t">How agentlog works</title>
  <desc id="d">Claude Code claims src/auth on the shared board. Codex's hook injects the claim, Codex asks Claude to pause, Claude's hook injects the request, Claude replies paused, then posts done, which releases the claim.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.6" stop-color="#151036"/>
      <stop offset="1" stop-color="#1e1035"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <symbol id="bot" viewBox="-20 -24 40 44">
      <line x1="0" y1="-14" x2="0" y2="-21" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="0" cy="-22" r="3" fill="currentColor"/>
      <rect x="-16" y="-14" width="32" height="28" rx="9" fill="currentColor"/>
      <circle cx="-6" cy="-1" r="3.6" fill="#0b1020"/>
      <circle cx="6" cy="-1" r="3.6" fill="#0b1020"/>
      <rect x="-5" y="7" width="10" height="2.6" rx="1.3" fill="#0b1020" fill-opacity="0.7"/>
    </symbol>
    <marker id="ah-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff8a65"/></marker>
    <marker id="ah-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#34d3b4"/></marker>
    <marker id="ah-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4ade80"/></marker>
    <marker id="ah-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c9b8ff"/></marker>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .lbl { font-size: 16px; fill: #eef0f7; }
      .sub { font-size: 13px; fill: #8b92ab; }
      .num { font-size: 13px; font-weight: 700; fill: #0b1020; }
    </style>
  </defs>

  <rect width="1200" height="620" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="620" rx="24" fill="url(#dots)"/>

  <!-- lane headers -->
  <g class="sans" text-anchor="middle">
    <g transform="translate(220 64)">
      <rect x="-120" y="-34" width="240" height="68" rx="14" fill="#ff8a65" fill-opacity="0.12" stroke="#ff8a65" stroke-opacity="0.55"/>
      <use href="#bot" x="-104" y="-20" width="36" height="40" color="#ff8a65"/>
      <text x="14" y="-4" font-size="18" font-weight="700" fill="#ff8a65">Claude Code</text>
      <text x="14" y="18" class="mono sub">worktree A</text>
    </g>
    <g transform="translate(600 64)">
      <rect x="-130" y="-34" width="260" height="68" rx="14" fill="#c9b8ff" fill-opacity="0.12" stroke="#c9b8ff" stroke-opacity="0.55"/>
      <path d="M-108 -14h14l5 5h21v25h-40z" fill="#c9b8ff"/>
      <text x="16" y="-4" font-size="18" font-weight="700" fill="#c9b8ff" class="mono">.agentlog/</text>
      <text x="16" y="18" class="sub">the shared board</text>
    </g>
    <g transform="translate(980 64)">
      <rect x="-120" y="-34" width="240" height="68" rx="14" fill="#34d3b4" fill-opacity="0.12" stroke="#34d3b4" stroke-opacity="0.55"/>
      <use href="#bot" x="-104" y="-20" width="36" height="40" color="#34d3b4"/>
      <text x="14" y="-4" font-size="18" font-weight="700" fill="#34d3b4">Codex</text>
      <text x="14" y="18" class="mono sub">worktree B</text>
    </g>
  </g>

  <!-- lifelines -->
  <g stroke-width="2" stroke-dasharray="3 7" stroke-linecap="round">
    <line x1="220" y1="104" x2="220" y2="540" stroke="#ff8a65" stroke-opacity="0.45"/>
    <line x1="600" y1="104" x2="600" y2="540" stroke="#c9b8ff" stroke-opacity="0.45"/>
    <line x1="980" y1="104" x2="980" y2="540" stroke="#34d3b4" stroke-opacity="0.45"/>
  </g>

  <g class="mono" text-anchor="middle">
    <!-- 1 claim -->
    <line x1="228" y1="160" x2="590" y2="160" stroke="#ff8a65" stroke-width="2.5" marker-end="url(#ah-o)"/>
    <text x="410" y="148" class="lbl">claim src/auth/**  ⏱ 2h</text>
    <!-- 2 hook delivers to codex -->
    <line x1="610" y1="226" x2="970" y2="226" stroke="#c9b8ff" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ah-w)"/>
    <text x="790" y="214" class="lbl">hook injects the claim</text>
    <text x="790" y="248" class="sub">on Codex’s next tool call</text>
    <!-- 3 request -->
    <line x1="972" y1="296" x2="610" y2="296" stroke="#34d3b4" stroke-width="2.5" marker-end="url(#ah-t)"/>
    <text x="790" y="284" class="lbl">request → claude: pause src/auth?</text>
    <!-- 4 hook delivers to claude -->
    <line x1="590" y1="362" x2="230" y2="362" stroke="#c9b8ff" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ah-w)"/>
    <text x="410" y="350" class="lbl">hook injects the request</text>
    <!-- 5 reply -->
    <line x1="228" y1="428" x2="590" y2="428" stroke="#ff8a65" stroke-width="2.5" marker-end="url(#ah-o)"/>
    <text x="410" y="416" class="lbl">reply: paused ✓</text>
    <!-- 6 done -->
    <line x1="228" y1="494" x2="590" y2="494" stroke="#4ade80" stroke-width="2.5" marker-end="url(#ah-g)"/>
    <text x="410" y="482" class="lbl">done · releases the claim</text>
  </g>

  <!-- step numbers -->
  <g class="sans" text-anchor="middle">
    <circle cx="64" cy="155" r="14" fill="#ff8a65"/><text x="64" y="160" class="num">1</text>
    <circle cx="64" cy="221" r="14" fill="#c9b8ff"/><text x="64" y="226" class="num">2</text>
    <circle cx="64" cy="291" r="14" fill="#34d3b4"/><text x="64" y="296" class="num">3</text>
    <circle cx="64" cy="357" r="14" fill="#c9b8ff"/><text x="64" y="362" class="num">4</text>
    <circle cx="64" cy="423" r="14" fill="#ff8a65"/><text x="64" y="428" class="num">5</text>
    <circle cx="64" cy="489" r="14" fill="#4ade80"/><text x="64" y="494" class="num">6</text>
  </g>

  <text x="600" y="586" text-anchor="middle" class="sans" font-size="15" fill="#8b92ab">Every message is a small file in <tspan class="mono" fill="#c9b8ff">&lt;main worktree&gt;/.agentlog/</tspan>, shared by every worktree and never committed.</text>
</svg>
