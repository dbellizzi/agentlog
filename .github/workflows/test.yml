name: test
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest] # ubuntu's /bin/sh is dash; macOS's is bash
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install shellcheck
        if: runner.os == 'macOS'
        run: brew install shellcheck
      - name: Validate manifests
        run: for f in .claude-plugin/marketplace.json .agents/plugins/marketplace.json plugins/agentlog/.claude-plugin/plugin.json plugins/agentlog/.codex-plugin/plugin.json plugins/agentlog/hooks/*.json; do jq -e . "$f" >/dev/null; done
      - name: Versions agree
        run: |
          v=$(sed -n 's/^VERSION=//p' plugins/agentlog/bin/agentlog)
          for f in plugins/agentlog/.claude-plugin/plugin.json plugins/agentlog/.codex-plugin/plugin.json; do
            [ "$(jq -r .version "$f")" = "$v" ] || { echo "$f version != script VERSION $v"; exit 1; }
          done
      - run: shellcheck plugins/agentlog/bin/agentlog tests/test.sh
      - run: tests/test.sh
