name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest] # ubuntu's /bin/sh is dash; macOS's is bash
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install shellcheck
        if: runner.os == 'macOS'
        run: brew install shellcheck
      - name: Validate manifests
        run: for f in .claude-plugin/plugin.json .codex-plugin/plugin.json .muse-plugin/plugin.json plugin.json hooks.json hooks/*.json; do jq -e . "$f" >/dev/null; done
      - name: Versions agree
        run: |
          v=$(sed -n 's/^VERSION=//p' bin/agentlog)
          for f in .claude-plugin/plugin.json .codex-plugin/plugin.json .muse-plugin/plugin.json plugin.json; do
            [ "$(jq -r .version "$f")" = "$v" ] || { echo "$f version != script VERSION $v"; exit 1; }
          done
      - name: Install Claude Code (tests/test.sh runs claude plugin validate)
        run: npm install -g @anthropic-ai/claude-code@2.1.282
      - run: shellcheck bin/agentlog hooks/muse/*.sh tests/test.sh tests/e2e.sh
      - run: tests/test.sh
